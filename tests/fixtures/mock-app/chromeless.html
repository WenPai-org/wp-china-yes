<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<title>WPCY chromeless + sandbox mock</title>
	<style>
		html, body { margin: 0; height: 100%; background: #f0f0f1; }
		iframe { width: 100%; height: 100%; border: 0; }
	</style>
</head>
<body>
	<iframe
		title="chromeless host"
		srcdoc="<!DOCTYPE html>
<html lang='zh-CN'>
<head><meta charset='utf-8'><title>host</title></head>
<body>
<p id='host-log'>chromeless host</p>
<iframe
	id='tool'
	title='mock tool'
	sandbox='allow-scripts allow-forms'
	referrerpolicy='strict-origin'
	src='index.html'
></iframe>
</body>
</html>"
	></iframe>
</body>
</html>
